name: Emulator Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # 每周日 UTC 20:00（北京时间周一 04:00）

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cold-start gate on emulator (release build)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Run emulator smoke (cold-start gate)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio
          disable-animations: true
          script: python audit/tools/emulator_telemetry.py --serial "emulator-5554" --phase install --apk app/build/outputs/apk/release/app-release.apk && python audit/tools/emulator_telemetry.py --serial "emulator-5554" --phase cold --cold-n 3 --assert-cold-ms 8000

      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-telemetry
          path: audit/artifacts/
          if-no-files-found: warn
